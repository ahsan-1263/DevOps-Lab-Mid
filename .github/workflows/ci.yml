
name: DevOps Assignment CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Automated Tests
        id: tests
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path reports | Out-Null
          python -m pytest -v --json-report --json-report-file=reports/pytest-report.json
          if ($LASTEXITCODE -ne 0) {
            exit 1
          }

      - name: Send Test Report to Local Receiver
        if: always()
        shell: pwsh
        run: |
          python send_report.py

      - name: Mark Workflow Failed if Tests Failed
        if: always() && steps.tests.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Error "Automated tests failed."
          exit 1
