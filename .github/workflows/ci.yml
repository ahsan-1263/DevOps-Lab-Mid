
name: DevOps Assignment CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: [self-hosted, Windows, X64]

    env:
      PYTHON_EXE: 'C:\Users\Ahsan H\AppData\Local\Programs\Python\Python313\python.exe'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Python
        shell: powershell
        run: |
          & "$env:PYTHON_EXE" --version
          & "$env:PYTHON_EXE" -m pip --version

      - name: Install Dependencies
        shell: powershell
        run: |
          & "$env:PYTHON_EXE" -m pip install --upgrade pip
          & "$env:PYTHON_EXE" -m pip install -r requirements.txt

      - name: Run Automated Tests
        id: tests
        continue-on-error: true
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path reports | Out-Null
          & "$env:PYTHON_EXE" -m pytest -v --json-report --json-report-file=reports/pytest-report.json
          if ($LASTEXITCODE -ne 0) {
            exit 1
          }

      - name: Send Test Report to Local Receiver
        if: always()
        shell: powershell
        run: |
          & "$env:PYTHON_EXE" send_report.py

      - name: Mark Workflow Failed if Tests Failed
        if: always() && steps.tests.outcome == 'failure'
        shell: powershell
        run: |
          Write-Error "Automated tests failed."
          exit 1
