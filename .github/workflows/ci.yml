
name: DevOps Assignment CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Python
        shell: powershell
        run: |
          py -3.12 --version

      - name: Install Dependencies
        shell: powershell
        run: |
         python -m pip install --upgrade pip
         python -m pip install -r requirements.txt

      - name: Run Automated Tests
        id: testsmn
        continue-on-error: true
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path reports | Out-Null
          py -3.12 -m pytest -v --json-report --json-report-file=reports/pytest-report.json
          if ($LASTEXITCODE -ne 0) {
            exit 1
          }

      - name: Send Test Report to Local Receiver
        if: always()
        shell: powershell
        run: |
          py -3.12 send_report.py

      - name: Mark Workflow Failed if Tests Failed
        if: always() && steps.tests.outcome == 'failure'
        shell: powershell
        run: |
          Write-Error "Automated tests failed."
          exit 1
